harray="60 60" style="animation-duration:1.7s;animation-delay:-0.10s"/><line class="st" x1="2075" y1="1176" x2="2075" y2="1792" stroke="#fff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="45 84" style="animation-duration:1.4s;animation-delay:-0.91s"/><line class="st" x1="2085" y1="1176" x2="2085" y2="1792" stroke="#fff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="70 44" style="animation-duration:1.4s;animation-delay:-0.67s"/><line class="st" x1="2093" y1="1176" x2="2093" y2="1792" stroke="#fff" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="70 92" style="animation-duration:1.1s;animation-delay:-0.34s"/></g><ellipse class="mist" cx="1250" cy="905" rx="80" ry="20" fill="url(#mist)"/><g><g><g class="bfly"><g class="wl"><path d="M0,0 C-6,-14 -22,-16 -20,-4 C-19,4 -8,4 0,0Z" fill="#FFE48A" stroke="#F2B84B" stroke-width=".6" stroke-opacity=".7"/><path d="M0,1 C-5,8 -15,14 -14,6 C-13,2 -6,1 0,1Z" fill="#FFE48A" stroke="#F2B84B" stroke-width=".6" stroke-opacity=".7"/></g><g class="wr"><path d="M0,0 C6,-14 22,-16 20,-4 C19,4 8,4 0,0Z" fill="#FFE48A" stroke="#F2B84B" stroke-width=".6" stroke-opacity=".7"/><path d="M0,1 C5,8 15,14 14,6 C13,2 6,1 0,1Z" fill="#FFE48A" stroke="#F2B84B" stroke-width=".6" stroke-opacity=".7"/></g><ellipse rx="1.8" ry="7" fill="#5B4636"/></g></g><animateMotion dur="14s" repeatCount="indefinite" path="M560,1000 C700,860 900,960 1000,860 S1250,820 1180,980 S760,1120 560,1000Z" begin="-0.0s"/></g><g><g><g class="bfly"><g class="wl"><path d="M0,0 C-6,-14 -22,-16 -20,-4 C-19,4 -8,4 0,0Z" fill="#FFFFFF" stroke="#D9D2C4" stroke-width=".6" stroke-opacity=".7"/><path d="M0,1 C-5,8 -15,14 -14,6 C-13,2 -6,1 0,1Z" fill="#FFFFFF" stroke="#D9D2C4" stroke-width=".6" stroke-opacity=".7"/></g><g class="wr"><path d="M0,0 C6,-14 22,-16 20,-4 C19,4 8,4 0,0Z" fill="#FFFFFF" stroke="#D9D2C4" stroke-width=".6" stroke-opacity=".7"/><path d="M0,1 C5,8 15,14 14,6 C13,2 6,1 0,1Z" fill="#FFFFFF" stroke="#D9D2C4" stroke-width=".6" stroke-opacity=" <section class="list-wrap"><h2 class="sec">島上還有</h2><div class="cards"><button type="button" class="card game" data-open="game"><b>貓咪下樓梯</b><small>小遊戲・有排行榜</small></button><button type="button" class="card" data-open="shout"><b>島民大聲說</b><small>留言給診所</small></button><button type="button" class="card" data-scene="coffee"><b>杜克勞咖啡座</b><small>拿鐵・美式</small></button></div></section><p class="to-main"><a href="/island/forest/">也去森林版逛逛 →</a></p>

<script>
document.querySelectorAll('[data-room]').forEach(a=>a.addEventListener('click',()=>{try{gtag('event','island_palace_click',{room:a.dataset.room})}catch(e){}}));
const NPC={"xiaoxiang": {"name": "詩晴・護理師", "lines": ["歡迎來逛逛！每棟建築的牌子都可以點。", "IG 和 FB 可以看到診所最近在忙什麼。", "想先了解自己的保養習慣？小測驗只要三題。"]}, "lulu": {"name": "Bella・護理師", "lines": ["出門前記得擦防曬，流汗之後要補擦喔。", "療程後怎麼照顧，請照醫師給的術後說明。", "皮膚有狀況的話，還是要找醫師當面看。"]}, "ashan": {"name": "杜克勞・詹（咖啡師）", "lines": ["我每天都帶柴柴和小白出來散步。", "無痕美學選用杜克勞咖啡，拿鐵或美式，冰熱都可以。", "散完步來杯咖啡，剛剛好。"]}, "meimei": {"name": "米秦・美容師", "lines": ["療程後多久可以上妝，先問過醫師最安心。", "今天水喝夠了嗎？補水小站可以記錄喔。", "聖誕節快到了，記得跟重要的人說聲謝謝。"]}},idx={},bub=document.getElementById('bub');let bt;
document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.npc,n=NPC[k];idx[k]=((idx[k]??-1)+1)%n.lines.length;
 document.getElementById('bub-n').textContent=n.name;document.getElementById('bub-t').textContent=n.lines[idx[k]];
 bub.style.top=`calc(${b.style.top} - 5.5%)`;bub.hidden=false;
 {const st=b.parentElement.getBoundingClientRect(),vr=sc.getBoundingClientRect(),br=b.getBoundingClientRect(),cx=br.left+br.width/2-st.left,w=bub.offsetWidth,
   lo=vr.left-st.left+8+w/2,hi=vr.right-st.left-8-w/2,x=Math.max(lo,Math.min(hi,cx));bub.style.left=x+'px';bub.style.setProperty('--ax',(w/2+cx-x)+'px')}bub.style.animation='none';bub.offsetWidth;bub.style.animation='';
 clearTimeout(bt);bt=setTimeout(()=>bub.hidden=true,6000);try{gtag('event','island_palace_npc',{npc:k})}catch(_){}}));
document.addEventListener('click',()=>bub.hidden=true);

const HOUSES={
 ig:{k:'IG 小屋',t:'在 IG 跟我們見面',who:'詩晴・護理師',say:'我每天都會去 IG 小屋看看有沒有新照片！',body:'<p>療程前後的小知識、診所日常、店貓的樣子，都放在 IG。</p>',go:['https://www.instagram.com/wuhen_clinic','ig','到 IG 追蹤 @wuhen_clinic']},
 fb:{k:'FB 小屋',t:'在 FB 粉專聊聊',who:'詩晴・護理師',say:'有什麼想問的，粉專留言也找得到我們。',body:'<p>衛教文章、診所公告和活動資訊，會先放在 FB 粉專。</p>',go:['https://www.facebook.com/share/1BKkoKfUPg/','fb','到 FB 粉專按讚追蹤']},
 blog:{k:'宮廷書房',t:'最新衛教文章',who:'Bella・護理師',say:'書架上的書會一直換新，有空就來翻翻。',body:'<ul class="posts" id="posts"><li><small>書架整理中…</small></li></ul>',go:['https://blog.wuhenclinic.tw/blog/','blog','逛整座書屋（健康衛教部落格）']}};

Object.assign(HOUSES,{
 gate:{k:'島嶼指南',t:'第一次來無痕美學島？',who:'詩晴・護理師',say:'每間小屋的牌子都可以點，慢慢逛，不趕時間。',body:`<p>點建築上的牌子就能進去逛：診所的八個空間、IG、FB、衛教文章，還有咖啡屋、防曬花園和補水小站。</p><p><strong>來診所：</strong>安和路一段86號2樓，預約制。捷運信義安和站 1 號出口步行 3–5 分鐘（7-11 轉角）。開車可從文昌街205號轉進，中信銀行大樓後方有地下停車場，對面也有平面停車場。</p>`,go:['https://lin.ee/QTZzv7U','line','LINE 預約諮詢']},
 coffee:{k:'杜克勞咖啡座',t:'無痕美學選用杜克勞咖啡',who:'杜克勞・詹',say:'帶狗狗散完步，來這裡喝杯熱拿鐵剛剛好。',body:`<p>診所裡的咖啡豆，來自詹老闆的杜克勞咖啡。</p><p>來診所時可以點<strong>拿鐵</strong>或<strong>美式</strong>，冰的熱的都可以，跟櫃台說一聲就好。</p><p>想認識詹老闆，可以回主島的咖啡角落找他聊聊。</p>`,go:['/island/','line2','回主島找杜克勞・詹']},
 sun:{k:'防曬花園',t:'Bella 的日常防曬筆記',who:'Bella・護理師',say:'花園裡的花也怕曬過頭，我幫它們搭了小陽傘。',body:`<p>日常防曬可以從這幾件小事開始：</p><ul class="list"><li>出門前 15–30 分鐘擦防曬，量要夠</li><li>流汗、擦汗或長時間在戶外，記得補擦</li><li>陰天也有紫外線，帽子、陽傘、太陽眼鏡一起用</li><li>保濕跟防曬一樣重要，臉乾的時候先補保濕</li></ul><p class="note">做完療程後的防曬和保養方式，請依照醫師給你的術後說明。</p>`,go:['https://blog.wuhenclinic.tw/blog/','blog2','看更多衛教文章']},
 rest:{k:'林間休息屋',t:'回家後怎麼照顧',who:'Bella・護理師',say:'休息屋的椅子很軟，坐一下再走吧。',body:`<p>做完療程回家，最常被問的是：什麼時候可以洗臉、化妝、運動？每個療程不一樣，醫師會依你的狀況說明。</p><p>森林書屋有整理好的術後照顧文章，主島的恢復室也有更完整的說明。</p><p class="note">有任何不舒服，直接打診所電話 02‑2755‑5673。</p>`,go:['/island/#recovery','line2','到主島恢復室看看']},
 animal:{k:'狗狗小屋',t:'森林裡的狗狗',who:'杜克勞・詹',say:'我每天帶柴柴和小白出來散步，牠們聽到腳步聲就會跑來門口，尾巴搖不停。',body:`<p>主島有貓店員，森林這邊則是狗狗的地盤。狗狗小屋住著詹老闆帶來散步的柴柴和小白，最喜歡在瀑布邊玩水，玩累了就趴在小屋門口曬太陽。</p><p>想看菀玲醫師的店貓，主島的貓咖區有四隻貓店員在等你。</p>`,go:['/island/#cats','line2','到主島貓咖區看貓']},
 water:{k:'補水小站',t:'今天喝水了嗎？',who:'米秦・美容師',say:'我每喝一杯水，就幫雪人加一顆鈕扣！',body:`<p>每喝一杯水就點一下水滴，幫自己記一下今天喝了幾杯。</p><div class="drops" id="drops"></div><p class="note" id="dropmsg"></p>`,init:initWater},

(function(){const scEl=document.getElementById('sc'),stg=scEl.querySelector('.stage');

 btn.addEventListener('click',e=>{e.stopPropagation();reset()});
 let pinch=null,pan=null,moved=false;
 const local=(t)=>{const r=scEl.getBoundingClientRect();return [t.clientX-r.left,t.clientY-r.top]};
 scEl.addEventListener('touchstart',e=>{if(e.touches.length===2){const [a,b]=[local(e.touches[0]),local(e.touches[1])];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:IZ.z,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,tx:IZ.tx,ty:IZ.ty};pan=null;e.preventDefault()}

 scEl.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const [a,b]=[local(e.touches[0]),local(e.touches[1])];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
   const z=Math.max(1,Math.min(3,pinch.z*d/pinch.d)),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
   const ix=(pinch.cx-pinch.tx)/pinch.z,iy=(pinch.cy-pinch.ty)/pinch.z;IZ.z=z;IZ.tx=cx-ix*z;IZ.ty=cy-iy*z;apply()}
  else if(pan&&e.touches.length===1){const p=local(e.touches[0]),dx=p[0]-pan.x,dy=p[1]-pan.y;if(Math.hypot(dx,dy)>8)moved=true;if(moved){e.preventDefault();IZ.tx=pan.tx+dx;IZ.ty=pan.ty+dy;apply()}}},{passive:false});

 function dogSVG(d){return `<g class="dog" data-dog="${d.id}" role="button" tabindex="0" aria-label="摸摸${d.name}"><ellipse cx="0" cy="2" rx="30" ry="7" fill="rgba(40,40,30,.22)"/>

   <path class="tail" d="M-22,-30 C-36,-40 -38,-56 -26,-58 C-22,-52 -28,-44 -18,-36Z" fill="${d.fur}" stroke="${d.fur2}" stroke-width="1.5"/>
   <rect class="leg l1" x="-20" y="-16" width="8" height="18" rx="4" fill="${d.fur2}"/><rect class="leg l2" x="10" y="-16" width="8" height="18" rx="4" fill="${d.fur2}"/>

   <ellipse cx="4" cy="-17" rx="14" ry="7" fill="${d.belly}"/>
   <rect class="leg l3" x="-14" y="-14" width="8" height="17" rx="4" fill="${d.fur}" stroke="${d.fur2}" stroke-width="1"/><rect class="leg l4" x="16" y="-14" width="8" height="17" rx="4" fill="${d.fur}" stroke="${d.fur2}" stroke-width="1"/>
   <g class="head" transform="translate(26,-40)"><path d="M-13,-8 L-10,-24 L-2,-12Z M3,-12 L11,-24 L13,-7Z" fill="${d.fur}" stroke="${d.fur2}" stroke-width="1.5"/><path d="M-9,-11 L-8,-19 L-4,-13Z M5,-13 L9,-19 L10,-11Z" fill="#F2B2A0"/>
    <circle r="16" fill="url(#dg-${d.id})" stroke="${d.fur2}" stroke-width="1.5"/><ellipse cx="5" cy="6" rx="10" ry="7.5" fill="${d.belly}"/>
    <circle cx="-4" cy="-2" r="2.3" fill="#2B2420"/><circle cx="8" cy="-2" r="2.3" fill="#2B2420"/><circle cx="-3.3" cy="-2.8" r=".8" fill="#fff"/><circle cx="8.7" cy="-2.8" r=".8" fill="#fff"/>
    <ellipse cx="7" cy="3.5" rx="2.6" ry="2" fill="#2B2420"/><path d="M4,7 Q7,10 10,7" fill="none" stroke="#2B2420" stroke-width="1.2" stroke-linecap="round"/>

  </g></g></g>`}


 const H=118,LEG=.2; /* legs = bottom 20% of sprite */
 function npcSVG(w){const h=H,wd=h*w.ar,ly=-h*LEG,id=w.id;
  return `<g class="dog walker" data-npc="${id}" role="button" tabindex="0" aria-label="和${NPC[id].name}說說話">
   <defs><clipPath id="cb-${id}"><rect x="${-wd}" y="${-h-10}" width="${wd*2}" height="${h-h*LEG+12}"/></clipPath>
   <clipPath id="cl-${id}"><rect x="${-wd}" y="${ly-2}" width="${wd}" height="${h*LEG+4}"/></clipPath><clipPath id="cr-${id}"><rect x="0" y="${ly-2}" width="${wd}" height="${h*LEG+4}"/></clipPath></defs>
   <ellipse class="shadow" cx="0" cy="1" rx="${wd*.36}" ry="6" fill="rgba(40,40,30,.25)"/><rect x="${-wd/2}" y="${-h}" width="${wd}" height="${h}" fill="transparent"/>
   <g class="flip"><g class="legL"><image href="${w.img}" x="${-wd/2}" y="${-h}" width="${wd}" height="${h}" clip-path="url(#cl-${id})"/></g><g class="legR"><image href="${w.img}" x="${-wd/2}" y="${-h}" width="${wd}" height="${h}" clip-path="url(#cr-${id})"/></g>
   <g class="body"><image href="${w.img}" x="${-wd/2}" y="${-h}" width="${wd}" height="${h}" clip-path="url(#cb-${id})"/></g></g></g>`}
 let defs='<defs>'+DOGS.map(d=>`<radialGradient id="dg-${d.id}" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${d.belly}" stop-opacity=".55"/><stop offset=".45" stop-color="${d.fur}"/><stop offset="1" stop-color="${d.fur2}"/></radialGradient>`).join('')+'</defs>';
 svgEl.innerHTML=defs+WALK.map(npcSVG).join('')+DOGS.map(dogSVG).join('');
 const rnd=(a,b)=>a+Math.random()*(b-a);
 function poly(path){const segs=[];let tot=0;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l});tot+=l}return{segs,tot}}
 function ptAt(pl,p){p=Math.max(0,Math.min(pl.tot,p));for(const g of pl.segs){if(p<=g.l)return [g.a[0]+(g.b[0]-g.a[0])*p/g.l,g.a[1]+(g.b[1]-g.a[1])*p/g.l];p-=g.l}return pl.segs[pl.segs.length-1].b}
 const mk=(d,kind)=>{const pl=poly(d.path),p0=ptAt(pl,Math.random()*pl.tot);
  return {d,kind,pl,el:svgEl.querySelector(kind==='npc'?`[data-npc="${d.id}"]`:`[data-dog="${d.id}"]`),x:p0[0],y:p0[1],vx:0,vy:0,tx:p0[0],ty:p0[1],
   wait:rnd(.5,3),face:Math.random()<.5?1:-1,phase:Math.random()*6,act:'idle',actT:0,hold:0,
   max:kind==='dog'?d.speed*1.25:d.speed*.9}};
 const all=[...WALK.map(w=>mk(w,'npc')),...DOGS.map(d=>mk(d,'dog'))],byId=Object.fromEntries(all.map(a=>[a.d.id,a]));
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
 function pickTarget(a){const p=ptAt(a.pl,Math.random()*a.pl.tot);a.tx=p[0]+rnd(-6,6);a.ty=p[1]+rnd(-3,3)}
 function think(a,dt){
  if(a.hold>0){a.hold-=dt;a.tx=a.x;a.ty=a.y;return}
  const lead=a.d.follow&&byId[a.d.follow];
  if(lead){const moving=Math.hypot(lead.vx,lead.vy)>3;
    if(moving){const off=-lead.face*a.d.lag;a.tx=lead.x+off+rnd(-1,1);a.ty=lead.y+16;a.act='walk'}
    else{if(a.wait>0){a.wait-=dt}else{const ang=rnd(0,6.28),r=rnd(25,60);a.tx=lead.x+Math.cos(ang)*r;a.ty=lead.y+6+Math.sin(ang)*r*.35;a.wait=rnd(1.5,4);a.act=Math.random()<.35?'sniff':'walk'}}
    return}
  const dist=Math.hypot(a.tx-a.x,a.ty-a.y);
  if(dist<4){if(a.wait>0){a.wait-=dt;if(a.kind==='npc'&&Math.random()<dt*.25)a.face*=-1}else{pickTarget(a);a.wait=a.kind==='dog'?rnd(.8,3):rnd(1.5,4.5);a.act=a.kind==='dog'&&Math.random()<.3?'sniff':'walk'}}}
 function frame(t){const dt=Math.min(50,t-(last||t))/1000;last=t;
  all.forEach(a=>{if(!reduce)think(a,dt);
   const dx=a.tx-a.x,dy=a.ty-a.y,dist=Math.hypot(dx,dy);
   const want=dist<3?0:Math.min(a.max,dist*1.6+4); /* slow down when arriving */
   const dvx=dist?dx/dist*want:0,dvy=dist?dy/dist*want:0,k=Math.min(1,dt*(a.kind==='dog'?4:2.5));
   a.vx+=(dvx-a.vx)*k;a.vy+=(dvy-a.vy)*k;a.x+=a.vx*dt;a.y+=a.vy*dt;
   const sp=Math.hypot(a.vx,a.vy);if(Math.abs(a.vx)>2)a.face=a.vx>0?1:-1;
   const stride=a.kind==='dog'?20:16;a.phase+=sp*dt/stride*Math.PI;const amt=Math.min(1,sp/(a.max*.6));

   a.el.setAttribute('transform',`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${sc.toFixed(3)})`);
   a.el.querySelector('.flip').setAttribute('transform',a.face<0?'scale(-1,1)':'');
   if(a.kind==='npc'){const s1=Math.sin(a.phase),breathe=Math.sin(t/900)*.006;
    const lift=v=>Math.max(0,v)*3.2*amt;
    a.el.querySelector('.legL').setAttribute('transform',`translate(0,${(-lift(s1)).toFixed(2)})`);
    a.el.querySelector('.legR').setAttribute('transform',`translate(0,${(-lift(-s1)).toFixed(2)})`);
    const bob=-Math.abs(Math.cos(a.phase))*2.2*amt,tilt=s1*1.6*amt+ (a.face*amt*1.2);

    a.el.querySelector('.shadow').setAttribute('rx',(H*a.d.ar*.36*(1-.08*Math.abs(Math.cos(a.phase))*amt)).toFixed(1))}
   else{const s1=Math.sin(a.phase)*22*amt,sniff=a.act==='sniff'&&sp<4;

    const bob=-Math.abs(Math.sin(a.phase))*2.4*amt;a.el.querySelector('.bob').setAttribute('transform',`translate(0,${bob.toFixed(2)})`);
    const head=a.el.querySelector('.head');head.setAttribute('transform',`translate(26,${(-40+(sniff?10:0)+Math.sin(a.phase*2)*1.2*amt).toFixed(2)}) rotate(${sniff?(18+Math.sin(t/120)*4).toFixed(1):(Math.sin(t/1400)*4).toFixed(1)})`);
    a.el.querySelector('.tail').setAttribute('transform',`rotate(${(Math.sin(t/(sp>4?110:160))*(sp>4?10:18)).toFixed(1)} -20 -34)`)}});
  const order=[...all].sort((p,q)=>p.y-q.y);let need=false;order.forEach((a,i)=>{if(svgEl.children[i+1]!==a.el)need=true});if(need)order.forEach(a=>svgEl.appendChild(a.el));
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
 const idx={};
 function talk(a,name,lines){const k=a.d.id;idx[k]=((idx[k]??-1)+1)%lines.length;a.hold=4;
