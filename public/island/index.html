<style>
/* Layout: one full-screen floating isometric clinic floor (2F) over the sea; rooms open a side drawer (desktop) or bottom sheet (phone). Single deliberate world whose sky follows the time of day. */
:root{
  --navy:#0E335F; --gold:#B08D57; --cream:#F2EDE6; --paper:#FBF8F3; --line:#E4DACB; --muted:#56657A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--navy);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}

#world{position:fixed;inset:0;overflow:hidden;
  --water:#7FA6C4; --hdr:#0E335F; --cloud:.92; --glow:0; --star:0; --sun:#F7D9A0; --halo:.35; --dim:none;}
#world[data-phase="dawn"]{--water:#9DB0C2;--hdr:#0E335F;--cloud:.9;--glow:.25;--star:0;--sun:#F6C9A0;--halo:.45;--dim:saturate(1.02)}
#world[data-phase="day"]{--water:#7FA6C4;--hdr:#0E335F;--cloud:.92;--glow:0;--star:0;--sun:#F7E2B0;--halo:.3;--dim:none}
#world[data-phase="dusk"]{--water:#66698A;--hdr:#FBF3E8;--cloud:.55;--glow:.7;--star:.25;--sun:#F0A779;--halo:.5;--dim:sepia(.18) brightness(.93)}
#world[data-phase="night"]{--water:#102C4F;--hdr:#F2EDE6;--cloud:.18;--glow:1;--star:1;--sun:#F2EDE6;--halo:.18;--dim:brightness(.72) saturate(.85)}

.sky{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.sky.dawn{background:linear-gradient(180deg,#EFC2A9 0%,#F4DCCB 45%,#F2EDE6 75%)}
.sky.day{background:linear-gradient(180deg,#A8C8E1 0%,#D6E5EE 45%,#EEF0EC 75%)}
.sky.dusk{background:linear-gradient(180deg,#3F3A66 0%,#B4697A 38%,#F0A46F 62%,#F7CF95 78%)}
.sky.night{background:linear-gradient(180deg,#060F24 0%,#0D2347 50%,#2A2D5C 78%)}
#world[data-phase="dawn"] .sky.dawn,#world[data-phase="day"] .sky.day,#world[data-phase="dusk"] .sky.dusk,#world[data-phase="night"] .sky.night{opacity:1}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#water{fill:var(--water);transition:fill 1.6s}
.star{fill:#FFF8E6;opacity:var(--star);transition:opacity 1.6s}
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:calc(var(--star)*.3)}}
.cloud{opacity:var(--cloud);transition:opacity 1.6s}
.cloud-move{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-520px)}to{transform:translateX(1320px)}}
#sun{transition:transform 1.8s cubic-bezier(.3,.7,.2,1)}
#sun .core{fill:var(--sun);transition:fill 1.6s}
#sun .halo{fill:var(--sun);opacity:var(--halo);transition:fill 1.6s,opacity 1.6s}
#bob{animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
#art{filter:var(--dim);transition:filter 1.6s}
#shadow{transform-box:fill-box;transform-origin:center;animation:shadow 6s ease-in-out infinite}
@keyframes shadow{50%{transform:scale(.93);opacity:.7}}
.ripple{fill:none;stroke:#fff;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ripple 7s ease-out infinite;opacity:0}
@keyframes ripple{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.45);opacity:0}}
.glow{opacity:var(--glow);transition:opacity 1.6s;mix-blend-mode:screen;pointer-events:none}
.spark{fill:#E9CF9E;animation:spark 4s ease-in-out infinite;opacity:0}
@keyframes spark{40%,60%{opacity:.95}}
.room{cursor:pointer}
.floor{transition:stroke .25s,stroke-width .25s}
.room.hot .floor,.room.active .floor{stroke:var(--gold);stroke-width:2.4}

/* header */
.top{transition:opacity .4s,color 1.6s;position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between;
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  color:var(--hdr);pointer-events:none}
.brand{pointer-events:auto;min-width:0}
.brand h1{margin:0;font:700 clamp(24px,4.4vw,34px)/1.15 var(--serif);letter-spacing:.06em;text-wrap:balance}
.brand p{margin:6px 0 0;font-size:13px;letter-spacing:.04em;opacity:.85}
.brand .addr{margin-top:2px;font-size:12px;opacity:.7}
.clock{pointer-events:auto;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(251,248,243,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(176,141,87,.35)}
.clock button{font:500 12px var(--sans);color:var(--navy);background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;letter-spacing:.04em}
.clock button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.clock button:focus-visible,.pin:focus-visible,.chip:focus-visible,#panel button:focus-visible,#panel a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* pins */
#pins{position:absolute;inset:0;pointer-events:none;z-index:4}
.boat{animation:boatbob 4s ease-in-out infinite}@keyframes boatbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;will-change:transform;transition:opacity .4s}
.pin .face{display:flex;align-items:center;gap:6px;white-space:nowrap;font:700 13px/1 var(--serif);letter-spacing:.06em;color:var(--navy);
  background:rgba(251,248,243,.95);border:1px solid var(--gold);border-radius:999px;padding:7px 12px 7px 9px;box-shadow:0 6px 16px rgba(14,51,95,.18);
  animation:pinbob 3.4s ease-in-out infinite;position:relative}
.pin .face::after{content:"";position:absolute;left:50%;bottom:-8px;width:1px;height:8px;background:var(--gold)}
.pin .dia{width:7px;height:7px;background:var(--gold);transform:rotate(45deg) scaleY(.8)}
.pin:hover .face,.pin.hot .face{background:var(--navy);color:var(--paper)}
.pin.dim{opacity:0;pointer-events:none}
@keyframes pinbob{50%{transform:translateY(-4px)}}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:5;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:500 13px var(--sans);color:var(--navy);background:rgba(251,248,243,.88);border:1px solid rgba(176,141,87,.45);border-radius:999px;padding:8px 14px;cursor:pointer;letter-spacing:.04em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip:hover{border-color:var(--gold);background:var(--paper)}
.legal{margin:0;max-width:760px;text-align:center;font-size:11px;line-height:1.6;color:var(--paper);opacity:.9;text-shadow:0 1px 2px rgba(5,20,40,.5)}

/* panel */
#panel{position:fixed;z-index:20;background:var(--paper);color:var(--navy);display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .55s;visibility:hidden;box-shadow:0 -10px 40px rgba(14,51,95,.22)}
#panel.open{visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){
  #panel{top:0;right:0;bottom:0;width:min(430px,92vw);transform:translateX(104%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .p-in{padding-right:max(26px,env(safe-area-inset-right,0px));padding-left:26px}
}
@media (max-width:760px){
  #panel{left:0;right:0;bottom:0;height:66%;border-radius:22px 22px 0 0;transform:translateY(104%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .p-in{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .handle{display:block}
  body.reading .top{opacity:0;pointer-events:none}
  body.reading .top *{pointer-events:none}
  .clock button{padding:6px 8px}
}
.handle{display:none;width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0}
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 6px;font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.p-head h2{margin:0;font:700 24px/1.25 var(--serif);letter-spacing:.06em}
.x{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:20px;line-height:1;cursor:pointer}
.p-body{flex:1;overflow-y:auto;padding-block:18px 24px;-webkit-overflow-scrolling:touch}
.p-foot{display:flex;justify-content:space-between;gap:10px;padding-block:12px 14px;border-top:1px solid var(--line)}
.p-foot button{font:500 13px var(--sans);color:var(--navy);background:none;border:0;padding:8px 2px;cursor:pointer;letter-spacing:.03em}
.p-foot button:hover{color:var(--gold)}

.lead{margin:0 0 6px;font:700 19px/1.55 var(--serif);letter-spacing:.03em;text-wrap:balance}
.sub{margin:0 0 16px;font-size:14px;line-height:1.75;color:var(--muted)}
.p-body p,.p-body li,.p-body dd{font-size:15px;line-height:1.8}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.seg button{font:500 14px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;letter-spacing:.04em}
.seg button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.facts{margin:0;display:grid;gap:14px}
.facts dt{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700;margin-bottom:2px}
.facts dd{margin:0}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.dlist li{position:relative;padding-left:22px}
.dlist li::before{content:"";position:absolute;left:3px;top:.72em;width:8px;height:8px;background:var(--gold);transform:rotate(45deg) scaleY(.75)}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font:700 13px/26px var(--serif);text-align:center}
.steps b{display:block;font-weight:700}
.steps span{color:var(--muted);font-size:14px}
.box{margin:18px 0 0;padding:14px 16px;border:1px dashed rgba(176,141,87,.7);border-radius:12px;background:#fff}
.box b{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);margin-bottom:4px}
.box p{margin:0}
.warn{border-style:solid;border-color:#E2B9A9;background:#FCF2EE}
.warn b{color:#A4553D}
.fine{margin:16px 0 0;font-size:12.5px !important;line-height:1.7 !important;color:var(--muted)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;min-height:46px;padding:0 22px;border-radius:999px;background:var(--navy);color:var(--paper);font:500 15px var(--sans);letter-spacing:.06em;text-decoration:none;border:0;cursor:pointer}
.cta.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.cta.off{background:#E9E3D9;color:var(--muted);cursor:default}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.ctas .cta{margin-top:18px}
.letter{font:500 16px/2 var(--serif);letter-spacing:.03em;margin:0}
.sign{margin:12px 0 0;text-align:right;font:700 15px var(--serif);letter-spacing:.1em}
.mail{display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.mail code{flex:1;min-width:0;font:500 15px var(--sans);user-select:all;overflow-wrap:anywhere}
.mail button{flex:0 0 auto;font:500 13px var(--sans);border:1px solid var(--gold);background:none;color:var(--navy);border-radius:999px;padding:6px 12px;cursor:pointer}

.city{opacity:0;transition:opacity 1.8s ease}
#world[data-phase="dawn"] .city.dawn,#world[data-phase="day"] .city.day,#world[data-phase="dusk"] .city.dusk,#world[data-phase="night"] .city.night{opacity:1}
.bill{animation:flick 6s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}48%{opacity:1}50%{opacity:.55}52%{opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand .cityname{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font:700 13px var(--serif);letter-spacing:.16em;padding:4px 10px;border-radius:999px;background:rgba(251,248,243,.18);border:1px solid rgba(176,141,87,.55)}
.cityname .dia{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
[hidden]{display:none!important}
/* eggs & npc */
.city{pointer-events:none}
#world[data-phase="dawn"] .city.dawn,#world[data-phase="day"] .city.day,#world[data-phase="dusk"] .city.dusk,#world[data-phase="night"] .city.night{pointer-events:auto}
.egg{cursor:pointer;outline:none}
.egg:hover>*:not(.egg-dot),.egg:focus-visible>*:not(.egg-dot){filter:brightness(1.18)}
.egg-dot .dotc{fill:#E9CF9E;stroke:#fff;stroke-width:1.4}
.egg-dot .ping{fill:none;stroke:#E9CF9E;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
.egg.found .egg-dot{display:none}
[data-npc]{cursor:pointer}
#bubble{position:fixed;left:0;top:0;z-index:6;pointer-events:none;max-width:min(240px,70vw);background:var(--paper);color:var(--navy);border:1px solid var(--gold);border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 8px 22px rgba(14,51,95,.22)}
#bubble b{display:block;font:700 11px var(--sans);letter-spacing:.14em;color:var(--gold);margin-bottom:2px}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--paper);border-right:1px solid var(--gold);border-bottom:1px solid var(--gold);transform:translateX(-50%) rotate(45deg)}
#npctag{position:fixed;left:0;top:0;z-index:4;border:0;padding:3px 8px;border-radius:999px;background:var(--gold);color:#fff;font:700 11px var(--serif);letter-spacing:.12em;box-shadow:0 4px 10px rgba(14,51,95,.25);transition:opacity .4s}
#npctag:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
body.reading #npctag{opacity:0;pointer-events:none}

.b-row{display:flex;gap:9px;align-items:center}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold);display:block}
.av svg{width:100%;height:100%;display:block}
.av-lg{width:72px;height:72px;border-width:2px}
.dir-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dir-name{margin:0;font:700 18px var(--serif);letter-spacing:.1em}
#bubble{max-width:min(270px,74vw)}
#bubble.act{pointer-events:auto}
.b-cta{display:block;width:100%;margin-top:8px;font:500 14px var(--sans);letter-spacing:.06em;color:var(--paper);background:var(--navy);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.b-cta:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#yttag{position:fixed;left:0;top:0;z-index:4;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);padding:4px 10px;border-radius:999px;background:var(--navy);color:var(--paper);font:700 11.5px var(--serif);letter-spacing:.1em;box-shadow:0 4px 12px rgba(14,51,95,.3);transition:opacity .4s;cursor:pointer}
#yttag .dot{width:7px;height:7px;border-radius:50%;background:#5ED39A;box-shadow:0 0 0 0 rgba(94,211,154,.6);animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 6px rgba(94,211,154,0)}}
#yttag:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body.reading #yttag{opacity:0;pointer-events:none}
.chat-note{font-size:12px;line-height:1.7;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.chatlog{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg .av{width:32px;height:32px;border-width:1px}
.msg .mb{max-width:82%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.7;overflow-wrap:anywhere;min-width:0}
.msg.bot .mb{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{justify-content:flex-end}
.msg.me .mb{background:var(--navy);color:var(--paper);border-bottom-right-radius:4px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#chatopts{margin-top:14px}
.opts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.opts button{font:500 14.5px var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--gold);border-radius:999px;padding:9px 16px;cursor:pointer;text-align:right}
.opts button:hover{background:var(--navy);color:var(--paper)}
.ask{display:grid;gap:8px}
.ask input,.ask textarea{font:400 15px var(--sans);color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;box-sizing:border-box;resize:vertical}
.ask input:focus,.ask textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.ask-row{display:flex;justify-content:flex-end;gap:8px}
.ask .send{font:500 14px var(--sans);background:var(--navy);color:var(--paper);border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
.ask .skip{font:500 14px var(--sans);background:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.sumcard b{display:block;font:700 14px var(--serif);color:var(--gold);letter-spacing:.08em;margin-bottom:4px}
.sumcard pre{margin:0;font:400 14px/1.75 var(--sans);white-space:pre-wrap;user-select:all}
.endcard{display:grid;gap:4px;padding:16px;border:1px solid var(--gold);border-radius:16px;background:#fff}
.endcard .cta{margin-top:6px}
.endcard .ctas .cta{margin-top:6px}
.end-l{margin:14px 0 0;font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.endcard .mail{margin-top:4px}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
#cat-kuro .tail{animation-duration:2.6s}
.heart{position:fixed;z-index:40;pointer-events:none;color:#E8577A;font-size:18px;transform:translate(-50%,-100%);animation:hup 1.1s ease-out forwards}
@keyframes hup{to{transform:translate(-50%,-260%) scale(1.4);opacity:0}}
.catlist{display:grid;gap:10px}
.catcard{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.cat-av{width:56px;height:56px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;grid-row:span 2}
.cat-av svg{width:44px;height:auto}
.cat-tx{min-width:0}
.cat-tx b{font:700 16px var(--serif);letter-spacing:.08em;margin-right:8px}
.cat-p{font-size:12px;color:var(--gold);letter-spacing:.06em}
.cat-say{margin:4px 0 0;font-size:14px !important;line-height:1.7 !important;color:var(--muted)}
.pet{justify-self:start;font:500 13px var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--gold);border-radius:999px;padding:6px 14px;cursor:pointer}
.pet:hover{background:var(--navy);color:var(--paper)}
#sun{cursor:pointer}
#sun:focus-visible .core{stroke:var(--gold);stroke-width:3}
.eyes-c,.zz{display:none}
.sleep .eyes-o{display:none}
.sleep .eyes-c,.sleep .zz{display:inline}
.sleep .tail{animation:none}
.zz{animation:zz 2.4s ease-in-out infinite}.zz2{animation-delay:.6s}
@keyframes zz{0%{opacity:0;transform:translateY(2px)}40%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
.goldglow{filter:drop-shadow(0 0 3px rgba(242,193,78,.95))}
#world[data-weather="rain"] .sky{filter:brightness(.8) saturate(.65)}
#world[data-weather="rain"] .cloud{opacity:1}
#world[data-weather="rain"] #sun{opacity:.35}
#world[data-weather="fog"] #cities{opacity:.5}
#world[data-weather="fog"] #sun{opacity:.6}
#world[data-fest="qixi"] .star{opacity:max(var(--star),.5)}
#wx{pointer-events:none}
.rd{animation:rd .6s linear infinite}
@keyframes rd{from{transform:translate(0,-160px)}to{transform:translate(-50px,420px)}}
.fogb{animation:fogd 36s linear infinite}
@keyframes fogd{from{transform:translateX(-200px)}to{transform:translateX(260px)}}
.sn{animation:snow 8s linear infinite}
@keyframes snow{from{transform:translate(0,-120px)}to{transform:translate(30px,560px)}}
#festsky{pointer-events:none}
#festsky .fmoon{pointer-events:auto;cursor:pointer}
#world[data-fest="midautumn"][data-phase="night"] #sun{opacity:0;pointer-events:none}
.fw{animation:fw 3.4s ease-out infinite;opacity:0}
@keyframes fw{0%{transform:scale(.2);opacity:0}10%{opacity:1}45%{transform:scale(1.15);opacity:.9}70%{opacity:0}100%{opacity:0}}
.lantern{animation:lant 17s linear infinite}
@keyframes lant{from{transform:translateY(80px);opacity:0}10%{opacity:1}90%{opacity:.9}to{transform:translateY(-520px);opacity:0}}
.floatup{animation:fup 11s linear infinite}
@keyframes fup{from{transform:translateY(40px);opacity:0}12%{opacity:.9}to{transform:translateY(-520px);opacity:0}}
.bird{animation:bird 11s linear infinite}
@keyframes bird{from{transform:translateX(-120px)}to{transform:translateX(920px)}}
.twk{animation:twk 1.6s ease-in-out infinite}
@keyframes twk{50%{opacity:.3}}
.dock-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.game-btn{background:rgba(176,141,87,.92);border-color:#E9CF9E}
.dock-row .blog-btn{background:rgba(251,248,243,.95);color:var(--navy);border-color:var(--gold);text-decoration:none;font-weight:700}
.blog-btn::before{content:"";width:12px;height:10px;border:2px solid var(--navy);border-top-width:3px;border-radius:1px 1px 2px 2px;box-sizing:border-box}
.dock-row .blog-btn:hover{background:#fff}
.blog-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.game-btn::before{content:"";width:9px;height:9px;border-radius:50%;background:#FCE9B8;box-shadow:0 0 0 3px rgba(252,233,184,.35)}
#game{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:linear-gradient(180deg,#A8C8E1 0%,#DCE9F1 60%,#F2EDE6 100%);padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.g-top{display:flex;justify-content:space-between;align-items:center}
.g-hud{display:flex;align-items:baseline;gap:8px;color:var(--navy)}
.g-hud b{font:700 26px var(--serif);font-variant-numeric:tabular-nums;min-width:1.6em}
.g-lb{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.g-meter{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;letter-spacing:.12em;color:var(--navy)}
.g-meter i{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.7);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(14,51,95,.15)}
.g-meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#F2C14E,#E8577A);transition:width .2s}
.g-field{position:relative;flex:1;overflow:hidden;margin-top:8px}
.g-sun{position:absolute;left:50%;top:-60px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,#FCE9B8 0 40%,rgba(252,233,184,0) 70%)}
.uv{position:absolute;top:0;width:54px;height:54px;margin-left:-27px;border-radius:50%;border:0;padding:0;cursor:pointer;font:700 13px var(--sans);letter-spacing:.04em;color:#fff;background:radial-gradient(circle at 35% 30%,#B9A6FF,#6B4FD8 70%);box-shadow:0 0 0 4px rgba(142,124,240,.25),0 6px 14px rgba(60,40,140,.3);touch-action:manipulation}
.uv.b{background:radial-gradient(circle at 35% 30%,#FFD98A,#E89A2E 70%);box-shadow:0 0 0 4px rgba(242,193,78,.3),0 6px 14px rgba(160,90,20,.3)}
.uv.bonus{border-radius:14px;width:50px;height:60px;margin-left:-25px;background:#FFFFFF;color:var(--navy);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(14,51,95,.25)}
.uv.pop{animation:pop .3s ease-out forwards;pointer-events:none}
@keyframes pop{to{opacity:0;scale:1.6}}
.g-face{height:70px;display:flex;justify-content:center}
.g-face svg{height:100%;width:auto}
.g-face.hurt svg{animation:hurt .3s}
@keyframes hurt{30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.g-card{box-sizing:border-box;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--paper);border:1px solid var(--gold);border-radius:20px;padding:22px 20px;box-shadow:0 18px 40px rgba(14,51,95,.3);text-align:center;color:var(--navy)}
.g-card h3{margin:0 0 8px;font:700 22px var(--serif);letter-spacing:.08em}
.g-card p{margin:0 0 10px;font-size:14.5px;line-height:1.75}
.g-legend{display:flex;justify-content:center;gap:14px;margin:12px 0 14px;font-size:12.5px;color:var(--muted)}
.g-legend span{display:flex;flex-direction:column;align-items:center;gap:4px}
.g-legend i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#B9A6FF,#6B4FD8 70%)}
.g-legend i.b{background:radial-gradient(circle at 35% 30%,#FFD98A,#E89A2E 70%)}
.g-legend i.s{border-radius:7px;width:22px;height:28px;background:#fff;box-shadow:0 0 0 2px var(--gold)}
.g-rank{display:inline-block;margin:4px 0 8px;padding:4px 16px;border-radius:999px;background:var(--navy);color:#E9CF9E;font:700 14px var(--serif);letter-spacing:.2em}
.g-card .g-big{font:700 48px var(--serif);font-variant-numeric:tabular-nums;margin:0;line-height:1.1}
.g-tip{background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;text-align:left}
.g-tip b{display:block;font-size:11px;letter-spacing:.16em;color:var(--gold)}
.g-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.g-btns .cta{margin-top:6px}
body.gaming #toast,body.gaming #bubble{display:none!important}
.b-x{position:absolute;top:4px;right:6px;width:24px;height:24px;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;border-radius:50%}
.b-x:focus-visible{outline:2px solid var(--gold)}
#bubble.act{padding-right:26px}
.av.mystery{position:relative;background:#2B3A4F}
.av.mystery svg{filter:brightness(0) opacity(.55)}
.av.mystery::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#E9CF9E;font:700 20px var(--serif)}
.guess{display:flex;gap:6px;margin-top:8px}
.guess input{flex:1;min-width:0;font:500 14px var(--sans);color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.guess input:focus{outline:2px solid var(--gold);outline-offset:1px}
.guess button{flex:0 0 auto;font:700 14px var(--serif);color:var(--paper);background:var(--navy);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.g-hint{margin:6px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.lineid{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.lineid code{flex:1;min-width:0;font:700 15px var(--sans);letter-spacing:.06em;user-select:all}
.lineid button{font:500 12px var(--sans);border:1px solid var(--gold);background:none;color:var(--navy);border-radius:999px;padding:4px 10px;cursor:pointer}
.b-btns{display:flex;gap:6px;margin-top:8px}
.b-btns .b-cta{margin-top:0;text-align:center;text-decoration:none;flex:1}
.b-cta.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.reg{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.regform{display:grid;gap:8px}
.regform label{font:700 13px var(--sans);letter-spacing:.06em;color:var(--navy)}
.regform label small{font-weight:400;color:var(--muted)}
.regform input,.regform textarea{font:400 15px var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;resize:vertical}
.regform input:focus,.regform textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.regform .cta{justify-self:start;margin-top:4px}
.reg-err{margin:0;color:#A4553D;font-size:13px;min-height:1em}
.reg-done b{font:700 17px var(--serif);color:var(--gold)}
.reg-done p{margin:6px 0 0;font-size:14px;line-height:1.75}
.reads{display:grid;gap:8px}
.read-a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);text-decoration:none;font-size:14.5px;line-height:1.55}
.read-a span{color:var(--gold);font-weight:700;flex:0 0 auto}
.read-a:hover{border-color:var(--gold)}
.read-a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* toast */
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px);width:min(380px,calc(100vw - 32px));display:flex;gap:10px;align-items:flex-start;background:var(--paper);color:var(--navy);border:1px solid var(--gold);border-radius:16px;padding:14px 12px 14px 16px;box-shadow:0 14px 34px rgba(14,51,95,.28)}
#toast.show{animation:tin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}
body.reading #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (min-width:761px){body.reading #toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);left:calc((100vw - min(430px,92vw))/2)}}
.t-body{flex:1;min-width:0;display:grid;gap:3px}
.t-body b{font:700 16px/1.4 var(--serif);letter-spacing:.04em}
.t-body span{font-size:14px;line-height:1.7;color:var(--muted)}
.t-eye{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--gold)}
.t-x{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;font-size:16px;line-height:1}

/* stamps */
.stamps{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;border:1px solid rgba(176,141,87,.6);background:rgba(14,51,95,.72);color:var(--paper);font:500 12.5px var(--sans);letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.st-dots{display:flex;gap:6px}
.st-dots i{width:9px;height:9px;border:1px solid #E9CF9E;transform:rotate(45deg);transition:background .4s}
.st-dots i.on{background:#E9CF9E}
.stamps.full{background:var(--gold);border-color:var(--gold);animation:glowp 2s ease-in-out infinite}
.stamps.full .st-dots i{border-color:#fff;background:#fff}
@keyframes glowp{50%{box-shadow:0 0 0 6px rgba(176,141,87,.25)}}
.stamps:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip.done::after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;vertical-align:2px;background:var(--gold);transform:rotate(45deg)}

/* section heads in panel */
.h3{margin:28px 0 12px;font:700 17px/1.4 var(--serif);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.h3::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.p-body>.h3:first-child{margin-top:0}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}
.q-prog{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-bottom:8px}
.q-bar{height:3px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.q-q{margin:0 0 12px;font:700 17px/1.5 var(--serif)}
.q-opts{display:grid;gap:8px}
.q-opts button{text-align:left;font:500 15px var(--sans);color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.q-opts button:hover{border-color:var(--gold)}
.note{position:relative;background:var(--navy);color:var(--paper);border-radius:16px;padding:20px 18px;box-shadow:inset 0 0 0 5px var(--navy),inset 0 0 0 6px rgba(233,207,158,.6)}
.note .eyebrow{color:#E9CF9E}
.note h4{margin:0 0 10px;font:700 21px/1.4 var(--serif);letter-spacing:.06em}
.note blockquote{margin:0 0 14px;padding:12px 14px;background:rgba(251,248,243,.08);border-radius:10px;font:500 15.5px/1.85 var(--serif)}
.note ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.8}
.note .fine{color:rgba(242,237,230,.75)}
.cta.gold{background:var(--gold);color:#fff}
.q-again{margin-top:10px;background:none;border:0;color:var(--muted);font:500 13px var(--sans);text-decoration:underline;cursor:pointer;padding:6px 0}

/* myths */
.myths{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.myth{display:grid;border:0;padding:0;background:none;text-align:left;cursor:pointer;perspective:900px;font:inherit;color:inherit}
.m-face{grid-area:1/1;display:flex;flex-direction:column;gap:8px;min-height:132px;padding:15px;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.m-front{background:var(--navy);color:var(--paper)}
.m-back{background:#fff;color:var(--navy);border:1px solid var(--gold);transform:rotateY(180deg)}
.myth[aria-pressed="true"] .m-front{transform:rotateY(-180deg)}
.myth[aria-pressed="true"] .m-back{transform:rotateY(0)}
.m-tag{font-size:11px;font-weight:700;letter-spacing:.16em;color:#E9CF9E}
.m-back .m-tag{color:var(--gold)}
.m-q{font:700 16px/1.5 var(--serif);flex:1}
.m-a{font-size:14px;line-height:1.75}
.m-hint{font-size:12px;opacity:.7;letter-spacing:.06em}
.myth:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:14px}

/* reward */
.step{display:flex;align-items:center;gap:8px;margin:26px 0 10px;font:700 16px var(--serif);letter-spacing:.06em}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--paper);font:700 12px/24px var(--sans);text-align:center}
.drum-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}
.drum{position:relative;width:74px;height:96px}
.drum .stk{position:absolute;bottom:58px;width:6px;height:44px;border-radius:3px;background:#D9B46A}
.drum .stk:nth-child(1){left:20px;transform:rotate(-10deg)}.drum .stk:nth-child(2){left:30px;height:52px}.drum .stk:nth-child(3){left:40px;transform:rotate(8deg)}.drum .stk:nth-child(4){left:48px;height:40px;transform:rotate(14deg)}
.drum .can{position:absolute;bottom:0;left:7px;width:60px;height:66px;border-radius:8px 8px 14px 14px;background:var(--navy);box-shadow:inset 0 0 0 3px var(--gold);display:flex;align-items:center;justify-content:center;color:#E9CF9E;font:700 16px var(--serif);letter-spacing:.1em;writing-mode:vertical-rl}
.drum.shake{animation:shake .18s ease-in-out 6}
@keyframes shake{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.fortune{position:relative;padding:20px 18px 18px;border-radius:16px;background:linear-gradient(180deg,#FFFDF8,#F7EFE2);border:1px solid var(--gold);text-align:center;animation:fin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes fin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.f-rank{display:inline-block;padding:3px 14px;border-radius:999px;background:#A4553D;color:#fff;font:700 13px var(--serif);letter-spacing:.2em}
.f-title{margin:10px 0 6px;font:700 15px var(--serif);color:var(--gold);letter-spacing:.2em}
.f-poem{margin:0;font:700 21px/1.7 var(--serif);letter-spacing:.12em}
.f-mean{margin:12px 0 0;font-size:14px !important;line-height:1.75 !important;color:var(--muted)}
.f-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.f-tags span{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;letter-spacing:.06em}
.f-no{margin:0 0 8px;font:700 13px var(--serif);letter-spacing:.3em;color:var(--muted)}
.fortune.fest{background:linear-gradient(180deg,#FFF6EE,#F8E3D6);border-color:#A4553D}
.fortune.fest .f-rank{background:var(--gold)}
.jiao-wrap{gap:10px;text-align:center}
.j-stick{margin:0}
.j-stick span{display:inline-block;writing-mode:vertical-rl;padding:12px 7px;border-radius:6px;background:#E9CF9E;color:#5B3D2C;font:700 15px var(--serif);letter-spacing:.2em;box-shadow:inset 0 0 0 2px #B08D57}
.j-ask{margin:0;font:700 16px/1.6 var(--serif)}
.j-ask small{font:400 12.5px var(--sans);color:var(--muted)}
.jiao{display:flex;gap:18px;justify-content:center;height:46px;align-items:flex-end}
.jb{width:62px;display:block}
.jb svg{width:100%;display:block}
.jiao.toss .jb{animation:toss .75s cubic-bezier(.3,.6,.3,1)}
.jiao.toss .jb:nth-child(2){animation-delay:.05s}
@keyframes toss{0%{transform:none}40%{transform:translateY(-58px) rotate(380deg)}75%{transform:translateY(0) rotate(700deg)}88%{transform:translateY(-6px) rotate(715deg)}100%{transform:rotate(720deg)}}
.j-dots{display:flex;gap:8px;justify-content:center}

/* ===== view box & camera ===== */
const svg=document.getElementById('scene'),camera=document.getElementById('camera');
let cam={s:1,tx:0,ty:0},camT={s:1,tx:0,ty:0};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fitView(){
  const W=innerWidth,H=innerHeight,a=W/H,cx=400,cy=350,needW=740,needH=650;
  let vw,vh; if(a>needW/needH){vh=needH;vw=vh*a}else{vw=needW;vh=vw/a}
  const shift=a<.8?-vh*.02:0;
  svg.setAttribute('viewBox',`${cx-vw/2} ${cy-vh/2+shift} ${vw} ${vh}`);
}
function focusRoom(id){
  const r=R[id],c=iso(r.x+r.w/2,r.y+r.d/2,22),panel=document.getElementById('panel');
  const W=innerWidth,H=innerHeight,side=W>760;
  const sx=side?(W-panel.offsetWidth)/2:W/2, sy=side?H/2:(H-panel.offsetHeight)/2+20;
  const pt=new DOMPoint(sx,sy).matrixTransform(svg.getScreenCTM().inverse());
  const s=side?1.75:1.6;
  camT={s,tx:pt.x-s*c[0],ty:pt.y-s*c[1]};
  if(reduce)cam={...camT};
}
function resetCam(){camT={s:1,tx:0,ty:0};if(reduce)cam={...camT}}

/* ===== walkers ===== */
function route(pts,speed,pause){
  const segs=[];let total=0;
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],len=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,len,dur:len/speed});total+=len/speed+pause}
  return t=>{let u=t%total;for(const s of segs){if(u<pause)return{p:s.a,moving:false,dir:s.b[0]-s.a[0]-(s.b[1]-s.a[1])};u-=pause;if(u<s.dur){const k=u/s.dur;return{p:[s.a[0]+(s.b[0]-s.a[0])*k,s.a[1]+(s.b[1]-s.a[1])*k],moving:true,dir:(s.b[0]-s.a[0])-(s.b[1]-s.a[1])}}u-=s.dur}return{p:pts[0],moving:false,dir:1}};
}
const nurseR=route([[3.05,2.5],[5.6,2.5]],.5,1.6);
const orangeR=WEATHER==='rain'?route([[8.25,3.74],[8.62,3.74]],.06,7):route([[7.95,4.45],[8.75,4.55],[8.55,4.95],[8.0,4.85]],.16,4.2);
const mochiR=WEATHER==='rain'?route([[7.86,3.9],[7.86,4.2]],.05,8):route([[8.2,5.0],[8.9,4.15]],.13,6);
const goldR=route([[8.6,4.2],[8.15,4.3],[8.4,4.6]],.1,5);
const doctorR=route([[2.5,5.35],[2.5,2.95]],.32,3.4);
const guestR=route([[5.78,5.78],[4.62,4.22]],.4,3.2);
const doctorEl=()=>document.getElementById('doctor'),nurseEl=()=>document.getElementById('nurse'),guestEl=()=>document.getElementById('guest');
let lastDir={nurse:1,guest:-1,doctor:1,orange:1,mochi:-1,gold:1};
function placeWalker(el,key,st,t){
  const [x,y]=iso(st.p[0],st.p[1]);
  if(st.dir) lastDir[key]=st.dir>0?1:-1;
  const b=st.moving?-Math.abs(Math.sin(t*9))*1.6:0;
  el.setAttribute('transform',`translate(${x.toFixed(1)},${(y+b).toFixed(1)}) scale(${lastDir[key]},1)`);
}

/* ===== pins & loop ===== */
const pinsWrap=document.getElementById('pins');
function buildPins(){
  pinsWrap.innerHTML=ROOMS.map(r=>`<button type="button" class="pin" data-room="${r.id}" aria-label="進入${r.name}"><span class="face"><span class="dia"></span>${r.name}</span></button>`).join('');
  document.getElementById('chips').innerHTML=ORDER.map(id=>`<button type="button" class="chip" data-room="${id}">${R[id].name}</button>`).join('');
}
const anchorEls={};
let lastNight=null,docTaps=0;
function loop(now){
  const t=now/1000;const isNight=world.dataset.phase==='night';
  const k=reduce?1:.085;
  cam.s+=(camT.s-cam.s)*k;cam.tx+=(camT.tx-cam.tx)*k;cam.ty+=(camT.ty-cam.ty)*k;
  camera.setAttribute('transform',`translate(${cam.tx.toFixed(2)},${cam.ty.toFixed(2)}) scale(${cam.s.toFixed(4)})`);
  if(!reduce){placeWalker(nurseEl(),'nurse',nurseR(t),t);placeWalker(guestEl(),'guest',guestR(t+4),t);placeWalker(doctorEl(),'doctor',doctorR(t+2),t);if(!isNight){placeWalker(npcEl('orange'),'orange',orangeR(t),t);placeWalker(npcEl('mochi'),'mochi',mochiR(t+7),t);if(RARE)placeWalker(npcEl('gold'),'gold',goldR(t+3),t)}for(const it of ISL){const el=document.getElementById(it.key);if(el)placeWalker(el,it.key,it.r(t+it.off),t)}}
  if(isNight!==lastNight){lastNight=isNight;['orange','mochi','kuro','gold','cutie'].forEach(k=>{const el=document.getElementById('cat-'+k);if(el)el.classList.toggle('sleep',isNight)})}
  npcFollow(now);
  pinsWrap.querySelectorAll('.pin').forEach(p=>{
    const a=anchorEls[p.dataset.room]||(anchorEls[p.dataset.room]=document.getElementById('a-'+p.dataset.room));
    const b=a.getBoundingClientRect();
    p.style.transform=`translate(${(b.left+b.width/2).toFixed(1)}px,${(b.top+b.height/2-8).toFixed(1)}px) translate(-50%,-100%)`;
  });
  requestAnimationFrame(loop);
}

const panel=document.getElementById('panel');
let current=null;
function openRoom(id,fromHash){
  if(!R[id])return;
  if(current!==id)track('island_room_open',{room:id});
  current=id;
  const i=ORDER.indexOf(id);
  document.getElementById('p-eyebrow').textContent=`2F　第 ${i+1} 站／共 ${ORDER.length} 站`;
  document.getElementById('p-title').textContent=R[id].name;
  document.getElementById('p-body').innerHTML=VIEW[id]()+mythHTML(id)+readHTML(id);document.querySelector('.p-foot').hidden=false;
  document.getElementById('p-body').scrollTop=0;
  if(id==='lobby'){renderConcern('sag');renderQuiz()}
  if(id==='recovery')renderCare('energy');
  const prev=ORDER[(i-1+ORDER.length)%ORDER.length],next=ORDER[(i+1)%ORDER.length];
  const pb=document.getElementById('p-prev'),nb=document.getElementById('p-next');
  pb.textContent=`← ${R[prev].name}`;pb.dataset.go=prev;nb.textContent=`下一站：${R[next].name} →`;nb.dataset.go=next;

  pinsWrap.querySelectorAll('.pin').forEach(p=>p.classList.toggle('dim',p.dataset.room!==id));
  focusRoom(id);stamp(id);
  if(!fromHash&&location.hash!=='#'+id)location.hash=id;
}
function closeRoom(fromHash){
  current=null;chat={data:{}};panel.classList.remove('open');document.body.classList.remove('reading');panel.setAttribute('aria-hidden','true');
  document.querySelectorAll('.room').forEach(g=>g.classList.remove('active'));
  pinsWrap.querySelectorAll('.pin').forEach(p=>p.classList.remove('dim'));
  resetCam();
  if(!fromHash&&location.hash)location.hash='';
}

/* ===== time of day ===== */
const world=document.getElementById('world');
let mode='auto';
const SUN={dawn:[200,168],day:[560,20],dusk:[740,400],night:[230,30]};
const CITY={dawn:'倫敦・清晨',day:'巴黎・白天',dusk:'台北・黃昏',night:'紐約・夜晚'};
function autoPhase(){const h=new Date().getHours();return h>=5&&h<8?'dawn':h>=8&&h<16?'day':h>=16&&h<19?'dusk':'night'}
function applyPhase(){
  const ph=mode==='auto'?autoPhase():mode;
  world.dataset.phase=ph;document.getElementById('cityname').textContent=CITY[ph]+(WEATHER==='rain'?'・下雨':WEATHER==='fog'?'・起霧':'');
  const [x,y]=SUN[ph];document.getElementById('sun').style.transform=`translate(${x}px,${y}px)`;
  document.querySelectorAll('.clock button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ph===mode)));
}

  if(e.target.closest('[data-draw]')){drawFortune();return}
  if(e.target.closest('[data-throw]')){throwJiao();return}
  if(e.target.closest('[data-skipjiao]')){if(!jiao.busy)revealFortune();return}
  const dw=e.target.closest('[data-dlwall]');if(dw){downloadWall(dw);return}
  const pt=e.target.closest('[data-pet]');if(pt){const k=pt.dataset.pet,n=NPCS[k];petCat(k);sayIdx[k]=((sayIdx[k]??0)+1)%n.lines.length;document.getElementById('say-'+k).textContent=n.lines[sayIdx[k]];heart(pt);return}
  const my=e.target.closest('[data-myth]');if(my){my.setAttribute('aria-pressed',String(my.getAttribute('aria-pressed')!=='true'));return}
  if(e.target.closest('.t-x')){document.getElementById('toast').hidden=true;return}
  const npc=e.target.closest('[data-npc]');if(npc){say(npc.dataset.npc);return}
  const eg=e.target.closest('[data-egg]');if(eg){openEgg(eg.dataset.egg);return}
  if(e.target.closest('#stamps')){
    if(visited.size>=ORDER.length)openReward();
    else{const miss=ORDER.filter(id=>!visited.has(id)).map(id=>R[id].name);toast(`<p class="t-eye">集章 ${visited.size}／${ORDER.length}</p><b>還差 ${miss.length} 個空間</b><span>${miss.join('、')}</span>`,5000)}
    return}
  if(e.target.id==='copymail'){
    const btn=e.target,addr=document.getElementById('mailaddr');
    const done=()=>{btn.textContent='已複製';setTimeout(()=>btn.textContent='複製',1600)};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(addr);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='已選取'};
    try{navigator.clipboard.writeText(CONTACT.email).then(done,fallback)}catch(_){fallback()}
    return;
  }
  const rm=e.target.closest('[data-room]');if(rm){openRoom(rm.dataset.room);return}
});
document.getElementById('p-close').addEventListener('click',()=>closeRoom());
document.addEventListener('input',e=>{if(e.target.id==='islander-name'){islander.name=e.target.value.trim();LS.set('wh-name',islander.name);clearTimeout(wallT);wallT=setTimeout(refreshWall,300)}});
document.addEventListener('submit',e=>{if(e.target.id==='regform'){e.preventDefault();submitReg();return}if(e.target.id==='guessform'){e.preventDefault();ytGuess(document.getElementById('guessin').value);return}if(e.target.id==='askform'){e.preventDefault();const i=document.getElementById('askinput'),v=i.value.trim();if(!v){i.focus();i.placeholder='寫一點點也可以喔';return}answer(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='askinput'&&e.target.tagName==='TEXTAREA'){e.preventDefault();document.getElementById('askform').requestSubmit()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!gEl('game').hidden){closeGame();return}if(e.key==='Escape'&&current)closeRoom();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [data-egg],svg [data-npc],svg [data-sky]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
['pointerover','pointerout'].forEach(ev=>document.addEventListener(ev,e=>{
  const el=e.target.closest&&e.target.closest('[data-room]');if(!el)return;
  const id=el.dataset.room,on=ev==='pointerover';
  document.querySelectorAll(`.room[data-room="${id}"]`).forEach(g=>g.classList.toggle('hot',on));
  pinsWrap.querySelectorAll(`.pin[data-room="${id}"]`).forEach(p=>p.classList.toggle('hot',on));
}));
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(R[h])openRoom(h,true);else if(h==='yiting'){if(ytKnown())openChat();else say('yiting')}else if(current&&R[current])closeRoom(true)});
addEventListener('resize',()=>{fitView();if(current&&R[current])focusRoom(current)});

/* ===== boot ===== */
FEST=HASH0.startsWith('fest-')&&FEST_NAME[HASH0.slice(5)]?HASH0.slice(5):festNow();
world.dataset.weather=WEATHER;if(FEST)world.dataset.fest=FEST;
buildSky();buildCities();buildIsland();buildFest();buildWeather();buildPins();renderStamps();fitView();applyPhase();
if(FEST)setTimeout(()=>{if(!current)toast(`<p class="t-eye">${FEST_NAME[FEST]}限定</p><b>島上換裝了！</b><span>這幾天抽院長保養籤，有機會抽到${FEST_NAME[FEST]}限定籤。</span>`,7000)},1600);
if(WEATHER!=='clear')setTimeout(()=>{if(!current)toast(WEATHER==='rain'?'<p class="t-eye">島上天氣</p><b>下雨了</b><span>貓店員都躲到沙發旁邊了。雨天紫外線比較弱，但還是有，防曬別放假。</span>':'<p class="t-eye">島上天氣</p><b>起霧了</b><span>城市看起來朦朦朧朧的。霧散了，紫外線一樣會回來。</span>',7000)},FEST?9500:1600);
setInterval(()=>{if(mode==='auto')applyPhase()},60000);
setTimeout(()=>{if(!found.size&&!current)toast('<p class="t-eye">小提示</p><b>島上藏著彩蛋</b><span>背景城市發亮的地標可以點，藏著肌膚冷知識。走廊上的林醫師也可以點點看。</span>',9000)},9000);
if(reduce){const n=iso(4.2,2.5),g=iso(5.78,5.78);nurseEl().setAttribute('transform',`translate(${n[0]},${n[1]})`);{const d=iso(2.5,4.4);doctorEl().setAttribute('transform',`translate(${d[0]},${d[1]})`)}guestEl().setAttribute('transform',`translate(${g[0]},${g[1]}) scale(-1,1)`)}
loadIslanders();
requestAnimationFrame(loop);
{const h=location.hash.slice(1);if(R[h])requestAnimationFrame(()=>openRoom(h,true));else if(h==='yiting')setTimeout(()=>{if(ytKnown())openChat();else say('yiting')},800)}
</script>
