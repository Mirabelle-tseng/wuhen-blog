<div class="sheet-bg" id="sheetbg" hidden></div><section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-t"><button type="button" class="sh-x" id="shx" aria-label="關閉">×</button><p class="sh-k" id="sh-k"></p><h2 id="sh-t"></h2><div id="sh-b"></div></section><p class="legal">本站為衛教資訊，所有療程需經醫師面診評估，效果因個人膚況而異。無痕美學診所｜台北市大安區安和路一段86號2樓<br>© 2026 無痕美學診所 版權所有，翻印必究。未經書面授權，請勿複製、轉載或改作本站內容與設計。</p>
<script>
document.querySelectorAll('[data-room]').forEach(a=>a.addEventListener('click',()=>{try{gtag('event','island_forest_click',{room:a.dataset.room})}catch(e){}}));
const NPC={"laoxiang": {"name": "木屋管家・老橡", "lines": ["歡迎來森林這一邊！房間都一樣，只是換成了木屋。", "想進哪一間，點屋頂上的牌子就好。", "走累了，長椅隨便坐，不用客氣。"]}, "xiaosong": {"name": "愛爬樹的小松", "lines": ["我在陽台上可以看到整座島喔！", "貓咖區在瀑布旁邊，那裡的貓最愛曬太陽。", "下雪的時候，屋頂會變得白白的。"]}, "ashan": {"name": "樹醫生・阿杉", "lines": ["我是樹醫生，專門幫森林裡的樹看診。", "樹皮曬太久也會乾，人也一樣，出門記得防曬。", "不過皮膚的事，還是要找診所的醫師當面看喔。"]}, "lulu": {"name": "照顧小動物的露露", "lines": ["我負責照顧森林裡的小動物。", "有看到貓咖區旁邊的小兔子嗎？牠是我的好朋友。", "渴了就到瀑布邊歇一下，記得多喝水。"]}, "meimei": {"name": "愛堆雪人的莓莓", "lines": ["我在跟聖誕樹拍照！", "那兩個雪人都是我堆的，帥不帥？", "聖誕節快到了，記得跟重要的人說聲謝謝。"]}},idx={},bub=document.getElementById('bub');let bt;
document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.npc,n=NPC[k];idx[k]=((idx[k]??-1)+1)%n.lines.length;
 document.getElementById('bub-n').textContent=n.name;document.getElementById('bub-t').textContent=n.lines[idx[k]];
 bub.style.top=`calc(${b.style.top} - 5.5%)`;bub.hidden=false;
 {const st=b.parentElement.getBoundingClientRect(),vr=sc.getBoundingClientRect(),br=b.getBoundingClientRect(),cx=br.left+br.width/2-st.left,w=bub.offsetWidth,
   lo=vr.left-st.left+8+w/2,hi=vr.right-st.left-8-w/2,x=Math.max(lo,Math.min(hi,cx));bub.style.left=x+'px';bub.style.setProperty('--ax',(w/2+cx-x)+'px')}bub.style.animation='none';bub.offsetWidth;bub.style.animation='';
 clearTimeout(bt);bt=setTimeout(()=>bub.hidden=true,6000);try{gtag('event','island_forest_npc',{npc:k})}catch(_){}}));
document.addEventListener('click',()=>bub.hidden=true);

const HOUSES={
 ig:{k:'IG 小屋',t:'在 IG 跟我們見面',who:'愛爬樹的小松',say:'我每天都會去 IG 小屋看看有沒有新照片！',body:'<p>療程前後的小知識、診所日常、店貓的樣子，都放在 IG。</p>',go:['https://www.instagram.com/wuhen_clinic','ig','到 IG 追蹤 @wuhen_clinic']},
 fb:{k:'FB 小屋',t:'在 FB 粉專聊聊',who:'木屋管家・老橡',say:'有什麼想問的，粉專留言也找得到我們。',body:'<p>衛教文章、診所公告和活動資訊，會先放在 FB 粉專。</p>',go:['https://www.facebook.com/share/1BKkoKfUPg/','fb','到 FB 粉專按讚追蹤']},
 blog:{k:'森林書屋',t:'最新衛教文章',who:'樹醫生・阿杉',say:'書架上的書會一直換新，有空就來翻翻。',body:'<ul class="posts" id="posts"><li><small>書架整理中…</small></li></ul>',go:['https://blog.wuhenclinic.tw/blog/','blog','逛整座書屋（健康衛教部落格）']}};

Object.assign(HOUSES,{
 gate:{k:'森林入口',t:'第一次來森林？',who:'木屋管家・老橡',say:'每間小屋的牌子都可以點，慢慢逛，不趕時間。',body:`<p>這是無痕美學島的森林版。小屋裡有診所的 IG、FB、衛教文章，也有咖啡屋、防曬花園和補水小站。逛累了，可以回主島看看真正的診所空間。</p><p><strong>來診所：</strong>安和路一段86號2樓，預約制。捷運信義安和站 1 號出口步行 3–5 分鐘（7-11 轉角）。開車可從文昌街205號轉進，中信銀行大樓後方有地下停車場，對面也有平面停車場。</p>`,go:['https://lin.ee/QTZzv7U','line','LINE 預約諮詢']},
 coffee:{k:'杜克勞咖啡屋',t:'無痕美學選用杜克勞咖啡',who:'樹醫生・阿杉',say:'來看診前先喝杯咖啡，我都點熱拿鐵。',body:`<p>診所裡的咖啡豆，來自詹老闆的杜克勞咖啡。</p><p>來診所時可以點<strong>拿鐵</strong>或<strong>美式</strong>，冰的熱的都可以，跟櫃台說一聲就好。</p><p>想認識詹老闆，可以回主島的咖啡角落找他聊聊。</p>`,go:['/island/','line2','回主島找杜克勞・詹']},
 sun:{k:'防曬花園',t:'樹醫生的日常防曬筆記',who:'樹醫生・阿杉',say:'花園裡的花也怕曬過頭，所以我會幫它們搭小陽傘。',body:`<p>日常防曬可以從這幾件小事開始：</p><ul class="list"><li>出門前 15–30 分鐘擦防曬，量要夠</li><li>流汗、擦汗或長時間在戶外，記得補擦</li><li>陰天也有紫外線，帽子、陽傘、太陽眼鏡一起用</li><li>保濕跟防曬一樣重要，臉乾的時候先補保濕</li></ul><p class="note">做完療程後的防曬和保養方式，請依照醫師給你的術後說明。</p>`,go:['https://blog.wuhenclinic.tw/blog/','blog2','看更多衛教文章']},
 rest:{k:'林間休息屋',t:'回家後怎麼照顧',who:'照顧小動物的露露',say:'休息屋的椅子很軟，坐一下再走吧。',body:`<p>做完療程回家，最常被問的是：什麼時候可以洗臉、化妝、運動？每個療程不一樣，醫師會依你的狀況說明。</p><p>森林書屋有整理好的術後照顧文章，主島的恢復室也有更完整的說明。</p><p class="note">有任何不舒服，直接打診所電話 02-2755-5673。</p>`,go:['/island/#recovery','line2','到主島恢復室看看']},
 animal:{k:'動物小屋',t:'森林裡的小動物',who:'照顧小動物的露露',say:'小兔子很怕吵，看牠的時候要小聲一點喔。',body:`<p>動物小屋住著露露照顧的小兔子，還有幾隻常常跑來曬太陽的貓。</p><p>想看菀玲醫師的店貓，主島的貓咖區有四隻貓店員在等你。</p>`,go:['/island/#cats','line2','到主島貓咖區']},
 water:{k:'補水小站',t:'今天喝水了嗎？',who:'愛堆雪人的莓莓',say:'我每喝一杯水，就幫雪人加一顆鈕扣！',body:`<p>每喝一杯水就點一下水滴，幫自己記一下今天喝了幾杯。</p><div class="drops" id="drops"></div><p class="note" id="dropmsg"></p>`,init:initWater},
 quiz:{k:'樹屋測驗',t:'你的保養習慣像哪一種樹？',who:'愛爬樹的小松',say:'答三題就知道！我自己是松樹型的。',body:'<div id="quiz"></div>',init:initQuiz}
});
function initWater(){const key='wh-water-'+new Date().toISOString().slice(0,10);let n=0;try{n=+localStorage.getItem(key)||0}catch(e){}
 const box=document.getElementById('drops'),msg=document.getElementById('dropmsg');
 const draw=()=>{box.innerHTML=Array.from({length:8},(_,i)=>`<button type="button" class="drop ${i<n?'on':''}" aria-label="第${i+1}杯">💧</button>`).join('');msg.textContent=n>=8?'今天的八杯水完成了，明天再來！':`今天喝了 ${n} 杯水`;
  box.querySelectorAll('.drop').forEach((b,i)=>b.addEventListener('click',()=>{n=i<n?i:i+1;try{localStorage.setItem(key,n)}catch(e){}draw();try{gtag('event','island_forest_water',{cups:n})}catch(e){}}))};draw()}
const QZ=[['早上出門前，你通常…',['擦好防曬才出門','有空才擦','出門再說']],['臉覺得乾的時候…',['馬上補保濕','晚上回家再擦','好像沒注意過']],['睡前的保養…',['固定步驟，每天都做','累了就跳過','洗完臉直接睡']]];
const QR=[{n:'松樹型',d:'一年四季都穩穩的。你的保養習慣很規律，繼續保持就好。'},{n:'楓樹型',d:'會跟著季節變化。忙起來容易漏掉步驟，可以先把防曬固定下來。'},{n:'橡樹型',d:'底子很好，但常常忘記照顧自己。從每天一個小步驟開始就可以。'}];
function initQuiz(){const el=document.getElementById('quiz');let i=0,sc=0;
 const step=()=>{if(i<QZ.length){el.innerHTML=`<p class="qn">第 ${i+1} 題／共 3 題</p><p><strong>${QZ[i][0]}</strong></p>`+QZ[i][1].map((o,j)=>`<button type="button" class="opt" data-j="${j}">${o}</button>`).join('');
   el.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{sc+=+b.dataset.j;i++;step()}))}
  else{const r=QR[sc<=1?0:sc<=3?1:2];el.innerHTML=`<p class="qn">你的結果</p><h3 class="qr">${r.n}</h3><p>${r.d}</p><p class="note">這是好玩的小測驗，不是皮膚檢測。想知道自己的膚況，歡迎預約醫師當面評估。</p><a class="go line" href="https://lin.ee/QTZzv7U" target="_blank" rel="noopener">LINE 預約醫師評估</a><button type="button" class="opt again">再玩一次</button>`;
   el.querySelector('.again').addEventListener('click',()=>{i=0;sc=0;step()});el.querySelector('.go').addEventListener('click',()=>{try{gtag('event','island_line_booking_click',{from:'forest_quiz'})}catch(e){}});try{gtag('event','island_forest_quiz',{result:r.n})}catch(e){}}};step()}
const BKEY='wh-forest-badges';const getB=()=>{try{return JSON.parse(localStorage.getItem(BKEY)||'{}')}catch(e){return{}}};
const setB=k=>{const b=getB();b[k]=1;try{localStorage.setItem(BKEY,JSON.stringify(b))}catch(e){}drawB()};
function drawB(){const b=getB(),n=['ig','fb','blog'].filter(k=>b[k]).length;document.getElementById('badges').innerHTML='森林徽章 '+['ig','fb','blog'].map(k=>`<b class="${b[k]?'on':''}">${k==='blog'?'書':k.toUpperCase()}</b>`).join('')+` ${n}/3`}
drawB();
const sheet=document.getElementById('sheet'),sbg=document.getElementById('sheetbg');
function openHouse(id){const h=HOUSES[id];document.getElementById('sh-k').textContent=h.k;document.getElementById('sh-t').textContent=h.t;
 const done=getB()[id];
 const soc=['ig','fb','blog'].includes(id),ext=h.go&&/^https?:/.test(h.go[0]);
 document.getElementById('sh-b').innerHTML=h.body+`<div class="say"><b>${h.who}</b><span>${h.say}</span></div>`+(h.go?`<a class="go ${h.go[1]}" href="${h.go[0]}" ${ext?'target="_blank" rel="noopener"':''} data-go="${id}">${h.go[2]}</a>`:'')+(soc?`<p class="done">${done?'已經拿到這間小屋的徽章了 ✓':'點按鈕前往，就能拿到這間小屋的森林徽章'}</p>`:'');
 sheet.hidden=sbg.hidden=false;try{gtag('event','island_forest_house',{house:id})}catch(e){}
 const g=sheet.querySelector('[data-go]');if(g&&h.go[1]==='line')g.addEventListener('click',()=>{try{gtag('event','island_line_booking_click',{from:'forest_gate'})}catch(e){}});if(h.init)h.init();
 if(soc)g.addEventListener('click',()=>{setB(id);try{gtag('event','island_forest_social',{platform:id})}catch(e){}sheet.querySelector('.done').textContent='拿到森林徽章了 ✓';if(['ig','fb','blog'].every(k=>getB()[k]))NPC.laoxiang.lines.unshift('三枚徽章都蓋滿了？你比我還熟這座森林了。謝謝你常來玩！')});
 if(id==='blog')loadPosts();sheet.querySelector('.sh-x').focus()}
function closeHouse(){sheet.hidden=sbg.hidden=true}
document.getElementById('shx').addEventListener('click',closeHouse);sbg.addEventListener('click',closeHouse);addEventListener('keydown',e=>{if(e.key==='Escape')closeHouse()});
document.querySelectorAll('[data-house]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openHouse(b.dataset.house)}));
let postsCache;async function loadPosts(){const ul=document.getElementById('posts');try{if(!postsCache){const x=new DOMParser().parseFromString(await (await fetch('/rss.xml')).text(),'text/xml');
 postsCache=[...x.querySelectorAll('item')].map(i=>({t:i.querySelector('title')?.textContent||'',l:i.querySelector('link')?.textContent||'#',d:new Date(i.querySelector('pubDate')?.textContent||0)})).sort((a,b)=>b.d-a.d).slice(0,6)}
 ul.innerHTML=postsCache.map(p=>`<li><a href="${p.l}" target="_blank" rel="noopener"><strong>${p.t.replace(/</g,'&lt;')}</strong><small>${isNaN(p.d)?'':p.d.toLocaleDateString('zh-TW')}</small></a></li>`).join('')}catch(e){ul.innerHTML='<li><a href="https://blog.wuhenclinic.tw/blog/" target="_blank" rel="noopener"><strong>到部落格看所有文章</strong></a></li>'}}
if(getB().ig&&getB().fb&&getB().blog)NPC.laoxiang.lines.unshift('三枚徽章都蓋滿了？你比我還熟這座森林了。謝謝你常來玩！');
const sc=document.getElementById('sc'),ctr=()=>{sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2};ctr();requestAnimationFrame(ctr);addEventListener('load',ctr);
</script></body></html>
