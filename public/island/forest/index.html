 gate:{k:'森林入口',t:'第一次來森林？',who:'森林嚮導・小橡',say:'每間小屋的牌子都可以點，慢慢逛，不趕時間。',body:`<p>這是無痕美學島的森林版。小屋裡有診所的 IG、FB、衛教文章，也有咖啡屋、防曬花園和補水小站。逛累了，可以回主島看看真正的診所空間。</p><p><strong>來診所：</strong>安和路一段86號2樓，預約制。捷運信義安和站 1 號出口步行 3–5 分鐘（7-11 轉角）。開車可從文昌街205號轉進，中信銀行大樓後方有地下停車場，對面也有平面停車場。</p>`,go:['https://lin.ee/QTZzv7U','line','LINE 預約諮詢']},
 coffee:{k:'杜克勞咖啡屋',t:'無痕美學選用杜克勞咖啡',who:'愛散步的阿杉',say:'帶狗狗散完步，來這裡喝杯熱拿鐵剛剛好。',body:`<p>診所裡的咖啡豆，來自詹老闆的杜克勞咖啡。</p><p>來診所時可以點<strong>拿鐵</strong>或<strong>美式</strong>，冰的熱的都可以，跟櫃台說一聲就好。</p><p>想認識詹老闆，可以回主島的咖啡角落找他聊聊。</p>`,go:['/island/','line2','回主島找杜克勞・詹']},
 sun:{k:'防曬花園',t:'露露的日常防曬筆記',who:'森林護理師・露露',say:'花園裡的花也怕曬過頭，我幫它們搭了小陽傘。',body:`<p>日常防曬可以從這幾件小事開始：</p><ul class="list"><li>出門前 15–30 分鐘擦防曬，量要夠</li><li>流汗、擦汗或長時間在戶外，記得補擦</li><li>陰天也有紫外線，帽子、陽傘、太陽眼鏡一起用</li><li>保濕跟防曬一樣重要，臉乾的時候先補保濕</li></ul><p class="note">做完療程後的防曬和保養方式，請依照醫師給你的術後說明。</p>`,go:['https://blog.wuhenclinic.tw/blog/','blog2','看更多衛教文章']},
 rest:{k:'林間休息屋',t:'回家後怎麼照顧',who:'森林護理師・露露',say:'休息屋的椅子很軟，坐一下再走吧。',body:`<p>做完療程回家，最常被問的是：什麼時候可以洗臉、化妝、運動？每個療程不一樣，醫師會依你的狀況說明。</p><p>森林書屋有整理好的術後照顧文章，主島的恢復室也有更完整的說明。</p><p class="note">有任何不舒服，直接打診所電話 02-2755-5673。</p>`,go:['/island/#recovery','line2','到主島恢復室看看']},
 animal:{k:'狗狗小屋',t:'森林裡的狗狗',who:'愛散步的阿杉',say:'我每天帶柴柴和小白出來散步，牠們聽到腳步聲就會跑來門口，尾巴搖不停。',body:`<p>主島有貓店員，森林這邊則是狗狗的地盤。狗狗小屋住著露露照顧的幾隻狗狗，最喜歡在瀑布邊玩水，玩累了就趴在小屋門口曬太陽。</p><p>想看菀玲醫師的店貓，主島的貓咖區有四隻貓店員在等你。</p>`,go:['/island/#cats','line2','到主島貓咖區看貓']},
 water:{k:'補水小站',t:'今天喝水了嗎？',who:'愛堆雪人的莓莓',say:'我每喝一杯水，就幫雪人加一顆鈕扣！',body:`<p>每喝一杯水就點一下水滴，幫自己記一下今天喝了幾杯。</p><div class="drops" id="drops"></div><p class="note" id="dropmsg"></p>`,init:initWater},

const IZ={z:1,tx:0,ty:0};
(function(){const scEl=document.getElementById('sc'),stg=scEl.querySelector('.stage');
 const btn=document.createElement('button');btn.type='button';btn.className='zoomout';btn.hidden=true;btn.textContent='回到全島';scEl.appendChild(btn);
 const clamp=()=>{const W=stg.offsetWidth,H=stg.offsetHeight;IZ.tx=Math.min(0,Math.max(W-W*IZ.z,IZ.tx));IZ.ty=Math.min(0,Math.max(H-H*IZ.z,IZ.ty))};
 const apply=()=>{clamp();stg.style.transform=IZ.z>1.01?`translate(${IZ.tx}px,${IZ.ty}px) scale(${IZ.z})`:'';stg.style.setProperty('--iz',(1/IZ.z).toFixed(3));btn.hidden=IZ.z<=1.01;scEl.style.touchAction=IZ.z>1.01?'none':'pan-y'};
 const reset=()=>{IZ.z=1;IZ.tx=0;IZ.ty=0;stg.style.transition='transform .25s';apply();setTimeout(()=>stg.style.transition='',260)};
 btn.addEventListener('click',e=>{e.stopPropagation();reset()});
 let pinch=null,pan=null,moved=false;
 const local=(t)=>{const r=scEl.getBoundingClientRect();return [t.clientX-r.left,t.clientY-r.top]};
 scEl.addEventListener('touchstart',e=>{if(e.touches.length===2){const [a,b]=[local(e.touches[0]),local(e.touches[1])];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:IZ.z,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,tx:IZ.tx,ty:IZ.ty};pan=null;e.preventDefault()}
  else if(e.touches.length===1&&IZ.z>1.01){const p=local(e.touches[0]);pan={x:p[0],y:p[1],tx:IZ.tx,ty:IZ.ty};moved=false}},{passive:false});
 scEl.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const [a,b]=[local(e.touches[0]),local(e.touches[1])];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
   const z=Math.max(1,Math.min(3,pinch.z*d/pinch.d)),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
   const ix=(pinch.cx-pinch.tx)/pinch.z,iy=(pinch.cy-pinch.ty)/pinch.z;IZ.z=z;IZ.tx=cx-ix*z;IZ.ty=cy-iy*z;apply()}
  else if(pan&&e.touches.length===1){const p=local(e.touches[0]),dx=p[0]-pan.x,dy=p[1]-pan.y;if(Math.hypot(dx,dy)>8)moved=true;if(moved){e.preventDefault();IZ.tx=pan.tx+dx;IZ.ty=pan.ty+dy;apply()}}},{passive:false});
 scEl.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;if(!e.touches.length){if(IZ.z<1.08)reset();pan=null}});
 scEl.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
 ['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
 document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
 addEventListener('resize',()=>{if(IZ.z>1)apply()});
 scEl.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const r=scEl.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,ix=(cx-IZ.tx)/IZ.z,iy=(cy-IZ.ty)/IZ.z;
  IZ.z=Math.max(1,Math.min(3,IZ.z*(e.deltaY<0?1.1:.9)));IZ.tx=cx-ix*IZ.z;IZ.ty=cy-iy*IZ.z;if(IZ.z<1.02)reset();else apply()},{passive:false});
})();

 function ptAt(pl,p){p=Math.max(0,Math.min(pl.tot,p));for(const g of pl.segs){if(p<=g.l)return [g.a[0]+(g.b[0]-g.a[0])*p/g.l,g.a[1]+(g.b[1]-g.a[1])*p/g.l];p-=g.l}return pl.segs[pl.segs.length-1].b}
 const mk=(d,kind)=>{const pl=poly(d.path),p0=ptAt(pl,Math.random()*pl.tot);
  return {d,kind,pl,el:svgEl.querySelector(kind==='npc'?`[data-npc="${d.id}"]`:`[data-dog="${d.id}"]`),x:p0[0],y:p0[1],vx:0,vy:0,tx:p0[0],ty:p0[1],
   wait:rnd(.5,3),face:Math.random()<.5?1:-1,phase:Math.random()*6,act:'idle',actT:0,hold:0,
   max:kind==='dog'?d.speed*1.25:d.speed*.9}};
 const all=[...WALK.map(w=>mk(w,'npc')),...DOGS.map(d=>mk(d,'dog'))],byId=Object.fromEntries(all.map(a=>[a.d.id,a]));
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
 function pickTarget(a){const p=ptAt(a.pl,Math.random()*a.pl.tot);a.tx=p[0]+rnd(-6,6);a.ty=p[1]+rnd(-3,3)}
 function think(a,dt){
  if(a.hold>0){a.hold-=dt;a.tx=a.x;a.ty=a.y;return}
  const lead=a.d.follow&&byId[a.d.follow];
  if(lead){const moving=Math.hypot(lead.vx,lead.vy)>3;
    if(moving){const off=-lead.face*a.d.lag;a.tx=lead.x+off+rnd(-1,1);a.ty=lead.y+16;a.act='walk'}
    else{if(a.wait>0){a.wait-=dt}else{const ang=rnd(0,6.28),r=rnd(25,60);a.tx=lead.x+Math.cos(ang)*r;a.ty=lead.y+6+Math.sin(ang)*r*.35;a.wait=rnd(1.5,4);a.act=Math.random()<.35?'sniff':'walk'}}
    return}
  const dist=Math.hypot(a.tx-a.x,a.ty-a.y);
  if(dist<4){if(a.wait>0){a.wait-=dt;if(a.kind==='npc'&&Math.random()<dt*.25)a.face*=-1}else{pickTarget(a);a.wait=a.kind==='dog'?rnd(.8,3):rnd(1.5,4.5);a.act=a.kind==='dog'&&Math.random()<.3?'sniff':'walk'}}}
 function frame(t){const dt=Math.min(50,t-(last||t))/1000;last=t;
  all.forEach(a=>{if(!reduce)think(a,dt);
   const dx=a.tx-a.x,dy=a.ty-a.y,dist=Math.hypot(dx,dy);
   const want=dist<3?0:Math.min(a.max,dist*1.6+4); /* slow down when arriving */
   const dvx=dist?dx/dist*want:0,dvy=dist?dy/dist*want:0,k=Math.min(1,dt*(a.kind==='dog'?4:2.5));
   a.vx+=(dvx-a.vx)*k;a.vy+=(dvy-a.vy)*k;a.x+=a.vx*dt;a.y+=a.vy*dt;
   const sp=Math.hypot(a.vx,a.vy);if(Math.abs(a.vx)>2)a.face=a.vx>0?1:-1;
   const stride=a.kind==='dog'?20:16;a.phase+=sp*dt/stride*Math.PI;const amt=Math.min(1,sp/(a.max*.6));
   const sc=(a.kind==='dog'?1.0:.95)+(a.y/1626)*.2;
   a.el.setAttribute('transform',`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) scale(${sc.toFixed(3)})`);
   a.el.querySelector('.flip').setAttribute('transform',a.face<0?'scale(-1,1)':'');
   if(a.kind==='npc'){const s1=Math.sin(a.phase),breathe=Math.sin(t/900)*.006;
    const lift=v=>Math.max(0,v)*3.2*amt;
    a.el.querySelector('.legL').setAttribute('transform',`translate(0,${(-lift(s1)).toFixed(2)})`);
    a.el.querySelector('.legR').setAttribute('transform',`translate(0,${(-lift(-s1)).toFixed(2)})`);
    const bob=-Math.abs(Math.cos(a.phase))*2.2*amt,tilt=s1*1.6*amt+ (a.face*amt*1.2);
    a.el.querySelector('.body').setAttribute('transform',`translate(0,${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 0 ${(-H*LEG).toFixed(1)}) scale(1,${(1+breathe).toFixed(4)})`);
    a.el.querySelector('.shadow').setAttribute('rx',(H*a.d.ar*.36*(1-.08*Math.abs(Math.cos(a.phase))*amt)).toFixed(1))}
   else{const s1=Math.sin(a.phase)*22*amt,sniff=a.act==='sniff'&&sp<4;
    const legs=a.el.querySelectorAll('.leg');/* diagonal trot: l1+l4 vs l2+l3 */
    [s1,-s1,-s1,s1].forEach((ang,i)=>{const l=legs[i],bx=+l.getAttribute('x')+4;l.setAttribute('transform',`rotate(${ang.toFixed(1)} ${bx} -14)`)});
    const bob=-Math.abs(Math.sin(a.phase))*2.4*amt;a.el.querySelector('.bob').setAttribute('transform',`translate(0,${bob.toFixed(2)})`);
    const head=a.el.querySelector('.head');head.setAttribute('transform',`translate(26,${(-40+(sniff?10:0)+Math.sin(a.phase*2)*1.2*amt).toFixed(2)}) rotate(${sniff?(18+Math.sin(t/120)*4).toFixed(1):(Math.sin(t/1400)*4).toFixed(1)})`);
    a.el.querySelector('.tail').setAttribute('transform',`rotate(${(Math.sin(t/(sp>4?110:160))*(sp>4?10:18)).toFixed(1)} -20 -34)`)}});
  const order=[...all].sort((p,q)=>p.y-q.y);let need=false;order.forEach((a,i)=>{if(svgEl.children[i+1]!==a.el)need=true});if(need)order.forEach(a=>svgEl.appendChild(a.el));
  requestAnimationFrame(frame)}
 requestAnimationFrame(frame);
 const idx={};
 function talk(a,name,lines){const k=a.d.id;idx[k]=((idx[k]??-1)+1)%lines.length;a.hold=4;
  document.getElementById('bub-n').textContent=name;document.getElementById('bub-t').textContent=lines[idx[k]];
  const r=a.el.getBoundingClientRect(),stg=a.el.closest('.stage').getBoundingClientRect(),vr=sc.getBoundingClientRect();bub.hidden=false;
  const w=bub.offsetWidth,cx=r.left+r.width/2-stg.left,lo=vr.left-stg.left+8+w/2,hi=vr.right-stg.left-8-w/2,x=Math.max(lo,Math.min(hi,cx));
  bub.style.left=(x/IZ.z)+'px';bub.style.top=((r.top-stg.top-6)/IZ.z)+'px';bub.style.setProperty('--ax',(w/2+cx-x)+'px');clearTimeout(bt);bt=setTimeout(()=>bub.hidden=true,5500)}
 all.forEach(a=>a.el.addEventListener('click',e=>{e.stopPropagation();
  if(a.kind==='npc'){const n=NPC[a.d.id];talk(a,n.name,n.lines);try{gtag('event','island_forest_npc',{npc:a.d.id})}catch(_){}}
  else{talk(a,a.d.name,a.d.lines);const lead=a.d.follow&&byId[a.d.follow];if(lead)lead.hold=4;try{gtag('event','island_forest_dog',{dog:a.d.id})}catch(_){}}}))})();
