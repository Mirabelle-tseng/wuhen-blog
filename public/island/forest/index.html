document.querySelectorAll('.npc').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.npc,n=NPC[k];idx[k]=((idx[k]??-1)+1)%n.lines.length;
 document.getElementById('bub-n').textContent=n.name;document.getElementById('bub-t').textContent=n.lines[idx[k]];
 bub.style.top=`calc(${b.style.top} - 5.5%)`;bub.hidden=false;
 {const st=b.parentElement.getBoundingClientRect(),vr=sc.getBoundingClientRect(),br=b.getBoundingClientRect(),cx=br.left+br.width/2-st.left,w=bub.offsetWidth,
   lo=vr.left-st.left+8+w/2,hi=vr.right-st.left-8-w/2,x=Math.max(lo,Math.min(hi,cx));bub.style.left=x+'px';bub.style.setProperty('--ax',(w/2+cx-x)+'px')}bub.style.animation='none';bub.offsetWidth;bub.style.animation='';
 clearTimeout(bt);bt=setTimeout(()=>bub.hidden=true,6000);try{gtag('event','island_forest_npc',{npc:k})}catch(_){}}));
document.addEventListener('click',()=>bub.hidden=true);
const sc=document.getElementById('sc'),ctr=()=>{sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2};ctr();requestAnimationFrame(ctr);addEventListener('load',ctr);
